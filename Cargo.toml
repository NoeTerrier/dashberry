[package]
name = "dashberry"
version = "0.1.0"
authors = ["Noe Terrier <noeterrier@proton.me>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.102"
dioxus = { version = "0.7.6", features = ["fullstack"] }
dockers = { version = "0.1.6", optional = true }
gloo-timers = { version = "0.4.0", features = ["futures"] }
humantime = "2.3.0"
netdev = { version = "0.42.0", optional = true }
reqwest = { version = "0.13.2", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
sysinfo = "0.38.4"

[features]
default = []
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
server = ["dioxus/server", "dep:dockers", "dep:netdev"]
