[package]
name = "dashberry"
version = "0.1.0"
authors = ["Noe Terrier <noeterrier@proton.me>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.104"
dioxus = { version = "0.7.10", features = ["fullstack"] }
dockers = { version = "0.1.6", optional = true }
gloo-timers = { version = "0.4.0", features = ["futures"] }
humantime = "2.4.0"
netdev = { version = "0.46.1", optional = true }
reqwest = { version = "0.13.4", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
sysinfo = "0.39.6"

[features]
default = []
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
server = ["dioxus/server", "dep:dockers", "dep:netdev"]
